<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Student Task Manager</h1>

  <form id="task-form">
    <label for="task-title">Task Title</label>
    <input type="text" id="task-title" placeholder="Enter task title" required>

    <label for="task-description">Description</label>
    <textarea id="task-description" placeholder="Enter task description"></textarea>

    <button type="button" id="add-btn">Add Task</button>
  </form>

  <div id="search-box" style="max-width:500px;margin:20px auto;">
    <input type="text" id="search-input" placeholder="Search tasks by title..." style="width:100%;box-sizing:border-box;">
  </div>

  <div id="task-list"></div>

  <script src="script.js"></script>
</body>
</html>
